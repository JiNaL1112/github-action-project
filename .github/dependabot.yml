version: 2

updates:
  # --- Maven (pom.xml) ---
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "maven"
    commit-message:
      prefix: "chore(deps)"

  # --- GitHub Actions (ci.yml, cd.yaml) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"

  # --- Dockerfile ---
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"