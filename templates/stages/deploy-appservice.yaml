parameters:
  - name: dependsOn
    type: object
    default: docker_build_push
  - name: azureSubscription
    type: string
  - name: resourceGroup
    type: string
  - name: webAppName
    type: string
  - name: registry
    type: string
  - name: imageName
    type: string
    default: bankapp
  - name: containerPort
    type: string
    default: '8080'
  - name: environment
    type: string
    default: bankapp-prod
  - name: healthUrl
    type: string

stages:
  - stage: deploy_app_service
    dependsOn: ${{ parameters.dependsOn }}
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - deployment: deploy
        environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Update App Service container image
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      SUB_ID=$(az account show --query id -o tsv)
                      IMAGE="${{ parameters.registry }}/${{ parameters.imageName }}:$(Build.SourceVersion)"

                      cat > container.json <<EOF
                      {
                        "properties": {
                          "image": "$IMAGE",
                          "targetPort": "${{ parameters.containerPort }}",
                          "isMain": true,
                          "authType": "SystemIdentity"
                        }
                      }
                      EOF

                      az rest --method put \
                        --url "https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/${{ parameters.resourceGroup }}/providers/Microsoft.Web/sites/${{ parameters.webAppName }}/sitecontainers/main?api-version=2024-11-01" \
                        --body @container.json

                      az webapp restart -g ${{ parameters.resourceGroup }} -n ${{ parameters.webAppName }}

                - script: |
                    for i in $(seq 1 20); do
                      code=$(curl -s -o /dev/null -w "%{http_code}" ${{ parameters.healthUrl }} || true)
                      echo "Attempt $i: HTTP $code"
                      [ "$code" = "200" ] && exit 0
                      sleep 15
                    done
                    echo "Smoke test failed"; exit 1
                  displayName: Smoke test