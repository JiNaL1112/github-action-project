apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankapp
  namespace: bankapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bankapp
  template:
    metadata:
      labels:
        app: bankapp
    spec:
      # Pod-level securityContext applies to all containers + volumes
      securityContext:
        runAsNonRoot: true        # KSV-0012: refuse to start if image tries to run as root
        runAsUser: 10001          # KSV-0020: uid > 10000, avoids collision with host's user table
        runAsGroup: 10001         # KSV-0021: same reasoning, for gid
        fsGroup: 10001            # ensures mounted volumes are group-writable by that uid
        seccompProfile:
          type: RuntimeDefault    # KSV-0030/KSV-0104: restricts available syscalls via the container runtime's default profile
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql-service 3306; do
                echo "waiting for mysql-service:3306...";
                sleep 2;
              done
              echo "mysql-service:3306 is accepting connections";
      containers:
        - name: bankapp
          image: jpatel6625/bankapp:a90ccf238173e95472b1eb11001008a28b94a615
          securityContext:
            allowPrivilegeEscalation: false   # KSV-0001: blocks setuid-style privilege escalation from inside the container
            readOnlyRootFilesystem: true      # KSV-0014: container can't tamper with its own filesystem or drop a payload to disk
            capabilities:
              drop:
                - ALL                          # KSV-0003/0004/0106: Spring Boot doesn't need any Linux capabilities (no raw sockets, no chown, etc.)
          # Mount the Azure Key Vault secrets as files in the container
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
            - name: tmp
              mountPath: /tmp   # required because readOnlyRootFilesystem=true — Spring Boot/embedded Tomcat need a writable /tmp
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: DB_NAME
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bankapp-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bankapp-secret
                  key: DB_PASSWORD
          resources:
            # KSV-0011/0015/0016/0018: without these, one runaway request or
            # memory leak in this container can starve every other pod on
            # the node — a self-inflicted DoS. Numbers below are a sane
            # starting point for a Spring Boot app; watch actual usage
            # (kubectl top pod) and tune.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "bankapp-azure-kv"
            nodePublishSecretRef:
              name: secrets-store-creds
         - name: tmp
           emptyDir: {}