apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: webapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mysql
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999     # mysql's own built-in uid — see note above re: KSV-0020
        runAsGroup: 999    # same, re: KSV-0021
        fsGroup: 999       # so the PVC is writable by that uid on mount
        seccompProfile:
          type: RuntimeDefault   # KSV-0030/KSV-0104
      containers:
        - name: mysql
          image: mysql:8
          securityContext:
            runAsUser: 999   # trivy:ignore:KSV-0020 — mysql image's built-in uid, see deployment-level comment
            runAsGroup: 999  # trivy:ignore:KSV-0021 — same reasoning
            allowPrivilegeEscalation: false   # KSV-0001
            readOnlyRootFilesystem: true      # KSV-0014
            capabilities:
              drop:
                - ALL                          # KSV-0003/0004/0106
          ports:
            - containerPort: 3306
              name: mysql
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: DB_NAME
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
         - name: secrets-store-inline
           csi:
             driver: secrets-store.csi.k8s.io
             readOnly: true
             volumeAttributes:
                secretProviderClass: "bankapp-azure-kv"
             nodePublishSecretRef:
                name: secrets-store-creds
