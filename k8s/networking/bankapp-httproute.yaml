# bankapp-httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bankapp-httproute
  namespace: bankapp
spec:
  parentRefs:
  - name: istio-cluster-gateway
    namespace: istio-ingress
    sectionName: http-bankapp
  hostnames:
  - "bankapp.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: bankapp-service
      namespace: bankapp
      port: 80